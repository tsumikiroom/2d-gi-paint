<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>2D GI Paint</title>
<style>
  :root {
    --bar-bg: rgba(18, 18, 20, 0.82);
    --btn: #2a2a2e;
    --btn-on: #f2f2f2;
    --fg: #e8e8e8;
    --fg-on: #111;
  }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font: 14px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; cursor: none; }
  #cursor { position: fixed; pointer-events: none; border: 1px solid rgba(255,255,255,0.7); border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6); transform: translate(-50%, -50%); display: none; }
  #bar { position: fixed; left: 8px; right: 8px; margin: 0 auto; width: fit-content; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 14px; background: var(--bar-bg);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); flex-wrap: wrap; justify-content: center; touch-action: none; }
  #bar button { appearance: none; border: 0; background: var(--btn); color: var(--fg); min-width: 44px; height: 44px;
    border-radius: 10px; font: inherit; padding: 0 10px; }
  @media (max-width: 520px) {
    #bar { gap: 4px; padding: 5px; }
    #bar button { padding: 0 8px; font-size: 13px; }
    #size { width: 80px; }
  }
  #bar button.on { background: var(--btn-on); color: var(--fg-on); }
  #swatch { padding: 0; width: 44px; }
  #swatch span { display: block; width: 26px; height: 26px; margin: auto; border-radius: 50%; border: 2px solid #fff; }
  #size { width: 96px; height: 44px; margin: 0; accent-color: #ddd; }
  #picker { position: fixed; left: 8px; right: 8px; margin: 0 auto; width: fit-content; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 120px);
    padding: 10px; border-radius: 14px; background: var(--bar-bg); display: none; touch-action: none; }
  #picker.open { display: block; }
  #picker canvas { display: block; border-radius: 8px; }
  #sv { margin-top: 8px; }
  #hint { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.55); font-size: 13px; pointer-events: none; transition: opacity 0.6s; white-space: nowrap; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: #ccc; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="cursor"></div>
<div id="hint">Draw with light. Walls block it.</div>
<div id="picker">
  <canvas id="hv" width="240" height="140"></canvas>
  <canvas id="sv" width="240" height="22"></canvas>
</div>
<div id="bar">
  <button data-tool="0" class="on" title="Light (1)">Light</button>
  <button data-tool="1" title="Wall (2)">Wall</button>
  <button data-tool="2" title="Erase (3)">Erase</button>
  <button id="swatch" title="Color"><span></span></button>
  <input id="size" type="range" min="2" max="80" value="12" title="Brush size">
  <button id="undo" title="Undo (Z)">Undo</button>
  <button id="clear" title="Clear (C)">Clear</button>
  <button id="save" title="Save PNG (S)">Save</button>
</div>
<div id="err"></div>
<script src="main.js"></script>
</body>
</html>
